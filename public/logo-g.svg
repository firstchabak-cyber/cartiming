<!-- G: 친근한 차 마스코트 (윙크) + 시계 -->
<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  <rect width="140" height="140" rx="28" fill="url(#bgG)"/>
  <!-- car body (front view) -->
  <rect x="22" y="58" width="96" height="42" rx="14" fill="white"/>
  <!-- roof -->
  <path d="M 36 58 L 50 38 L 90 38 L 104 58 Z" fill="white"/>
  <!-- windshield -->
  <path d="M 44 58 L 53 44 L 87 44 L 96 58 Z" fill="#1e3a8a"/>
  <!-- headlights (eyes) - winking left eye -->
  <ellipse cx="38" cy="78" rx="7" ry="6" fill="#fbbf24"/>
  <circle cx="38" cy="78" r="3" fill="#1e293b"/>
  <!-- right eye (closed wink) -->
  <path d="M 95 78 Q 102 73 109 78" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <!-- smile (grille) -->
  <path d="M 60 92 Q 70 98 80 92" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- wheels -->
  <circle cx="38" cy="105" r="10" fill="#0f172a"/>
  <circle cx="38" cy="105" r="3.5" fill="white"/>
  <circle cx="102" cy="105" r="10" fill="#0f172a"/>
  <circle cx="102" cy="105" r="3.5" fill="white"/>
  <!-- timing bubble top right -->
  <circle cx="112" cy="28" r="14" fill="#f59e0b"/>
  <text x="112" y="28"
        font-family="sans-serif" font-size="14" font-weight="900"
        fill="white" text-anchor="middle" dominant-baseline="central" dy="1">⏱</text>
</svg>
