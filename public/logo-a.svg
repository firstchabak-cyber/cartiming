<!-- A: 위에서 본 차량 실루엣 -->
<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  <rect width="140" height="140" rx="28" fill="url(#bgA)"/>
  <!-- car body -->
  <rect x="46" y="22" width="48" height="96" rx="18" fill="white"/>
  <!-- front windshield -->
  <rect x="52" y="34" width="36" height="22" rx="3" fill="#1e3a8a"/>
  <!-- rear windshield -->
  <rect x="52" y="84" width="36" height="22" rx="3" fill="#1e3a8a"/>
  <!-- side mirrors -->
  <rect x="42" y="60" width="6" height="8" rx="1.5" fill="white"/>
  <rect x="92" y="60" width="6" height="8" rx="1.5" fill="white"/>
  <!-- wheels -->
  <rect x="40" y="40" width="8" height="14" rx="2" fill="#0f172a"/>
  <rect x="92" y="40" width="8" height="14" rx="2" fill="#0f172a"/>
  <rect x="40" y="86" width="8" height="14" rx="2" fill="#0f172a"/>
  <rect x="92" y="86" width="8" height="14" rx="2" fill="#0f172a"/>
</svg>
