<!-- C v5: 배경 풀 대각선 차트 + 차가 정중앙 -->
<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <filter id="lineGlowC" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="140" height="140" rx="28" fill="url(#bgC)"/>

  <!-- BACKGROUND horizontal grid lines -->
  <line x1="10" y1="30" x2="130" y2="30" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <line x1="10" y1="55" x2="130" y2="55" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <line x1="10" y1="80" x2="130" y2="80" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <line x1="10" y1="105" x2="130" y2="105" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- BACKGROUND filled area under trend -->
  <path d="M 10 130 L 10 116 L 35 100 L 60 80 L 85 56 L 110 32 L 125 18 L 130 18 L 130 130 Z"
        fill="url(#trendFill)"/>

  <!-- BACKGROUND trend line (full diagonal, behind car) -->
  <polyline points="10,116 35,100 60,80 85,56 110,32 125,18"
            fill="none" stroke="#f59e0b" stroke-width="3.8"
            stroke-linecap="round" stroke-linejoin="round"
            filter="url(#lineGlowC)"/>
  <!-- data points -->
  <circle cx="10" cy="116" r="2.2" fill="#fef3c7" opacity="0.8"/>
  <circle cx="35" cy="100" r="2.2" fill="#fef3c7" opacity="0.8"/>
  <circle cx="60" cy="80" r="2.2" fill="#fef3c7" opacity="0.8"/>
  <circle cx="85" cy="56" r="2.2" fill="#fef3c7" opacity="0.8"/>
  <circle cx="110" cy="32" r="2.2" fill="#fef3c7" opacity="0.8"/>

  <!-- 화살표 (끝점) -->
  <g transform="translate(125, 18)">
    <circle cx="0" cy="0" r="7" fill="#fbbf24"/>
    <polygon points="-10,4 6,-4 4,8" fill="#fbbf24"/>
  </g>

  <!-- FOREGROUND car — 정중앙 배치 (vertical center ~70) -->
  <!-- shadow under car -->
  <ellipse cx="70" cy="88" rx="42" ry="3" fill="rgba(0,0,0,0.3)"/>
  <!-- body -->
  <path d="M 27 85
           L 27 75
           Q 27 70 32 70
           L 39 70
           Q 42 58 50 54
           L 65 49
           Q 70 48 75 49
           L 90 54
           Q 98 58 101 70
           L 108 70
           Q 113 70 113 75
           L 113 85
           Z"
        fill="white"/>
  <!-- window glass -->
  <path d="M 47 65
           Q 50 58 56 56
           L 65 53
           Q 70 52 75 53
           L 84 56
           Q 90 58 93 65
           Z"
        fill="#1e3a8a"/>
  <!-- door line -->
  <line x1="69" y1="55" x2="69" y2="70" stroke="rgba(30,58,138,0.3)" stroke-width="1"/>
  <!-- wheels -->
  <circle cx="42" cy="85" r="8" fill="#0f172a"/>
  <circle cx="42" cy="85" r="3" fill="white"/>
  <circle cx="98" cy="85" r="8" fill="#0f172a"/>
  <circle cx="98" cy="85" r="3" fill="white"/>
  <!-- headlight -->
  <circle cx="109" cy="76" r="1.8" fill="#fbbf24"/>
</svg>
