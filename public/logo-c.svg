<!-- C v8: 지그재그 우상향 라인 차트 + 큰 차 + 끝 화살표 -->
<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <filter id="lineGlowC" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="140" height="140" rx="28" fill="url(#bgC)"/>

  <!-- BACKGROUND grid lines (상단 영역만) -->
  <line x1="10" y1="18" x2="130" y2="18" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <line x1="10" y1="36" x2="130" y2="36" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <line x1="10" y1="54" x2="130" y2="54" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- 지그재그 차트 영역 채움 (글로우 효과) -->
  <path d="M 10 60 L 10 50 L 30 22 L 55 42 L 80 18 L 105 35 L 128 10 L 130 10 L 130 60 Z"
        fill="url(#trendFill)"/>

  <!-- 지그재그 라인: 위↑ 아래↓ 위↑ 아래↓ 위↑↑ -->
  <polyline points="10,50 30,22 55,42 80,18 105,35 128,10"
            fill="none" stroke="#f59e0b" stroke-width="3.8"
            stroke-linecap="round" stroke-linejoin="round"
            filter="url(#lineGlowC)"/>

  <!-- 각 꺾이는 지점 데이터 포인트 -->
  <circle cx="10"  cy="50" r="2.5" fill="#fef3c7"/>
  <circle cx="30"  cy="22" r="2.5" fill="#fef3c7"/>
  <circle cx="55"  cy="42" r="2.5" fill="#fef3c7"/>
  <circle cx="80"  cy="18" r="2.5" fill="#fef3c7"/>
  <circle cx="105" cy="35" r="2.5" fill="#fef3c7"/>

  <!-- 끝점 화살표 (오른쪽 상단 최고점) -->
  <g transform="translate(128, 10)">
    <circle cx="0" cy="0" r="6" fill="#fbbf24"/>
    <polygon points="-2,-8 8,-2 -2,8" fill="#fbbf24"/>
  </g>

  <!-- FOREGROUND car — 크게, 하단 -->
  <!-- shadow -->
  <ellipse cx="70" cy="123" rx="55" ry="3.5" fill="rgba(0,0,0,0.3)"/>
  <!-- body -->
  <path d="M 14 119
           L 14 106
           Q 14 100 21 100
           L 30 100
           Q 33 86 42 81
           L 60 74
           Q 70 72 80 74
           L 98 81
           Q 107 86 110 100
           L 119 100
           Q 126 100 126 106
           L 126 119
           Z"
        fill="white"/>
  <!-- window glass -->
  <path d="M 39 95
           Q 43 85 51 83
           L 62 79
           Q 70 77 78 79
           L 89 83
           Q 97 85 101 95
           Z"
        fill="#1e3a8a"/>
  <!-- door line -->
  <line x1="69" y1="80" x2="69" y2="100" stroke="rgba(30,58,138,0.3)" stroke-width="1.2"/>
  <!-- wheels -->
  <circle cx="34" cy="119" r="10" fill="#0f172a"/>
  <circle cx="34" cy="119" r="4" fill="white"/>
  <circle cx="106" cy="119" r="10" fill="#0f172a"/>
  <circle cx="106" cy="119" r="4" fill="white"/>
  <!-- headlight -->
  <circle cx="122" cy="103" r="2.2" fill="#fbbf24"/>
</svg>
