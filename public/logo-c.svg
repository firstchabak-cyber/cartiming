<!-- C v4: 전체 대각선 차트 + 끝에 화살표 + 차가 중앙에 올라탄 느낌 -->
<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <filter id="lineGlowC" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="140" height="140" rx="28" fill="url(#bgC)"/>

  <!-- BACKGROUND horizontal grid lines (subtle, full width) -->
  <line x1="10" y1="30" x2="130" y2="30" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <line x1="10" y1="55" x2="130" y2="55" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <line x1="10" y1="80" x2="130" y2="80" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <line x1="10" y1="105" x2="130" y2="105" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- BACKGROUND filled area under trend (sunset glow) — 좌하단부터 우상단까지 풀 -->
  <path d="M 10 130 L 10 116 L 35 100 L 60 80 L 85 56 L 110 32 L 125 18 L 130 18 L 130 130 Z"
        fill="url(#trendFill)"/>

  <!-- BACKGROUND trend line — 좌하단에서 우상단으로 풀 대각선 -->
  <polyline points="10,116 35,100 60,80 85,56 110,32 125,18"
            fill="none" stroke="#f59e0b" stroke-width="3.8"
            stroke-linecap="round" stroke-linejoin="round"
            filter="url(#lineGlowC)"/>
  <!-- chart data points -->
  <circle cx="10" cy="116" r="2.2" fill="#fef3c7" opacity="0.8"/>
  <circle cx="35" cy="100" r="2.2" fill="#fef3c7" opacity="0.8"/>
  <circle cx="60" cy="80" r="2.2" fill="#fef3c7" opacity="0.8"/>
  <circle cx="85" cy="56" r="2.2" fill="#fef3c7" opacity="0.8"/>
  <circle cx="110" cy="32" r="2.2" fill="#fef3c7" opacity="0.8"/>

  <!-- 화살표 (끝점, 굵직하게) -->
  <g transform="translate(125, 18)">
    <circle cx="0" cy="0" r="7" fill="#fbbf24"/>
    <polygon points="-10,4 6,-4 4,8" fill="#fbbf24"/>
  </g>

  <!-- FOREGROUND car — 중앙 배치, 차트 위에 올라탄 느낌 -->
  <!-- shadow under car -->
  <ellipse cx="70" cy="103" rx="40" ry="2.5" fill="rgba(0,0,0,0.3)"/>
  <!-- body -->
  <path d="M 30 100
           L 30 92
           Q 30 88 34 88
           L 40 88
           Q 43 78 50 75
           L 65 71
           Q 70 70 75 71
           L 90 75
           Q 97 78 100 88
           L 106 88
           Q 110 88 110 92
           L 110 100
           Z"
        fill="white"/>
  <!-- window glass -->
  <path d="M 48 84
           Q 51 78 56 76
           L 65 73
           Q 70 72 75 73
           L 84 76
           Q 89 78 92 84
           Z"
        fill="#1e3a8a"/>
  <!-- door line -->
  <line x1="69" y1="75" x2="69" y2="88" stroke="rgba(30,58,138,0.3)" stroke-width="1"/>
  <!-- wheels -->
  <circle cx="45" cy="100" r="7" fill="#0f172a"/>
  <circle cx="45" cy="100" r="2.5" fill="white"/>
  <circle cx="95" cy="100" r="7" fill="#0f172a"/>
  <circle cx="95" cy="100" r="2.5" fill="white"/>
  <!-- headlight -->
  <circle cx="106" cy="93" r="1.5" fill="#fbbf24"/>
</svg>
