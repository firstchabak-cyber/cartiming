<!-- C: 측면 차 + 우상향 추세 -->
<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  <rect width="140" height="140" rx="28" fill="url(#bgC)"/>
  <!-- uptrend line -->
  <polyline points="22,108 50,90 78,68 102,46"
            fill="none" stroke="#f59e0b" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arrow head -->
  <polyline points="92,46 102,46 102,56"
            fill="none" stroke="#f59e0b" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- side view car (simple) -->
  <!-- body -->
  <rect x="22" y="80" width="96" height="20" rx="6" fill="white"/>
  <!-- roof -->
  <path d="M 38 80 L 50 65 L 90 65 L 102 80 Z" fill="white"/>
  <!-- windows -->
  <path d="M 50 68 L 56 80 L 84 80 L 88 68 Z" fill="#1e3a8a"/>
  <!-- wheel wells -->
  <circle cx="40" cy="100" r="11" fill="#0f172a"/>
  <circle cx="100" cy="100" r="11" fill="#0f172a"/>
  <!-- wheel rims -->
  <circle cx="40" cy="100" r="4" fill="white"/>
  <circle cx="100" cy="100" r="4" fill="white"/>
</svg>
