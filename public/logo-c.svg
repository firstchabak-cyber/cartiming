<!-- C v7: 주식 캔들스틱 차트 (상승/하락 봉) + 큰 차 + 끝 화살표 -->
<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  <rect width="140" height="140" rx="28" fill="url(#bgC)"/>

  <!-- BACKGROUND grid (상단만) -->
  <line x1="10" y1="18" x2="130" y2="18" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <line x1="10" y1="36" x2="130" y2="36" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <line x1="10" y1="54" x2="130" y2="54" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- 캔들스틱 1: 하락 (음봉, 빨강) -->
  <line x1="20" y1="22" x2="20" y2="52" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="15" y="32" width="10" height="16" fill="#ef4444"/>

  <!-- 캔들스틱 2: 상승 (양봉, 주황) -->
  <line x1="42" y1="14" x2="42" y2="44" stroke="#fde68a" stroke-width="1.5"/>
  <rect x="37" y="20" width="10" height="20" fill="#f59e0b"/>

  <!-- 캔들스틱 3: 하락 (음봉, 빨강) -->
  <line x1="64" y1="24" x2="64" y2="54" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="59" y="34" width="10" height="14" fill="#ef4444"/>

  <!-- 캔들스틱 4: 상승 (양봉, 주황) -->
  <line x1="86" y1="12" x2="86" y2="40" stroke="#fde68a" stroke-width="1.5"/>
  <rect x="81" y="18" width="10" height="18" fill="#f59e0b"/>

  <!-- 캔들스틱 5: 강한 상승 (큰 양봉, 주황) -->
  <line x1="108" y1="8" x2="108" y2="34" stroke="#fde68a" stroke-width="1.5"/>
  <rect x="103" y="12" width="10" height="18" fill="#f59e0b"/>

  <!-- 우상향 화살표 (오른쪽 끝, 가격 목표) — 크게 -->
  <g transform="translate(127, 12)">
    <polygon points="-4,-7 -4,7 7,0" fill="#fbbf24"/>
    <line x1="-14" y1="0" x2="-4" y2="0" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- FOREGROUND car — 크게, 하단 -->
  <!-- shadow -->
  <ellipse cx="70" cy="123" rx="55" ry="3.5" fill="rgba(0,0,0,0.3)"/>
  <!-- body -->
  <path d="M 14 119
           L 14 106
           Q 14 100 21 100
           L 30 100
           Q 33 86 42 81
           L 60 74
           Q 70 72 80 74
           L 98 81
           Q 107 86 110 100
           L 119 100
           Q 126 100 126 106
           L 126 119
           Z"
        fill="white"/>
  <!-- window glass -->
  <path d="M 39 95
           Q 43 85 51 83
           L 62 79
           Q 70 77 78 79
           L 89 83
           Q 97 85 101 95
           Z"
        fill="#1e3a8a"/>
  <!-- door line -->
  <line x1="69" y1="80" x2="69" y2="100" stroke="rgba(30,58,138,0.3)" stroke-width="1.2"/>
  <!-- wheels -->
  <circle cx="34" cy="119" r="10" fill="#0f172a"/>
  <circle cx="34" cy="119" r="4" fill="white"/>
  <circle cx="106" cy="119" r="10" fill="#0f172a"/>
  <circle cx="106" cy="119" r="4" fill="white"/>
  <!-- headlight -->
  <circle cx="122" cy="103" r="2.2" fill="#fbbf24"/>
</svg>
