<!-- C v2: 측면 차 + 우상향 추세 (다듬은 버전) -->
<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="140" height="140" rx="28" fill="url(#bgC)"/>

  <!-- chart background grid (subtle) -->
  <line x1="22" y1="92" x2="118" y2="92" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="22" y1="72" x2="118" y2="72" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="22" y1="52" x2="118" y2="52" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- uptrend line with data points -->
  <polyline points="28,98 50,86 72,68 94,50 116,32"
            fill="none" stroke="#f59e0b" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round"
            filter="url(#lineGlow)"/>
  <!-- data points -->
  <circle cx="28" cy="98" r="3" fill="#f59e0b"/>
  <circle cx="50" cy="86" r="3" fill="#f59e0b"/>
  <circle cx="72" cy="68" r="3" fill="#f59e0b"/>
  <circle cx="94" cy="50" r="3" fill="#f59e0b"/>
  <!-- arrow head at end -->
  <polygon points="116,32 108,30 112,38" fill="#f59e0b"/>
  <circle cx="116" cy="32" r="5" fill="#f59e0b"/>

  <!-- side view car (sleeker, lower profile) -->
  <!-- main body (sedan silhouette) -->
  <path d="M 18 112
           L 18 105
           Q 18 100 23 100
           L 30 100
           Q 33 90 40 86
           L 60 80
           Q 70 78 80 80
           L 95 86
           Q 100 90 102 100
           L 112 100
           Q 117 100 117 105
           L 117 112
           Z"
        fill="white"/>
  <!-- windows (side glass) -->
  <path d="M 38 95
           Q 41 88 47 86
           L 60 83
           Q 70 81 78 83
           L 90 86
           Q 95 88 97 95
           Z"
        fill="#1e3a8a"/>
  <!-- door line (subtle) -->
  <line x1="67" y1="85" x2="67" y2="100" stroke="rgba(30,58,138,0.3)" stroke-width="1.2"/>
  <!-- wheels -->
  <circle cx="38" cy="112" r="9" fill="#0f172a"/>
  <circle cx="38" cy="112" r="3.5" fill="white"/>
  <circle cx="102" cy="112" r="9" fill="#0f172a"/>
  <circle cx="102" cy="112" r="3.5" fill="white"/>
  <!-- headlight (front, right side) -->
  <circle cx="113" cy="103" r="2" fill="#fbbf24"/>
</svg>
